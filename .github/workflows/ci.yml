name: PHP build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the PHP runtime and locked dependencies
        run: docker build -t checklist-ci .
      - name: Check code format
        run: docker run --rm checklist-ci vendor/bin/pint --test
