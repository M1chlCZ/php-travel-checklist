image: php:8.4-cli
variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
check:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip libonig-dev libxml2-dev libsqlite3-dev
    - docker-php-ext-install -j2 mbstring pdo_mysql pdo_sqlite dom xml xmlwriter
    - php -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
    - php -r "exit(hash_file('sha384', '/tmp/composer-setup.php') === trim(file_get_contents('https://composer.github.io/installer.sig')) ? 0 : 1);"
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --no-progress
  script:
    - vendor/bin/pint --test
